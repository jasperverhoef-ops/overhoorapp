<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <!-- Background — rounded, turquoise -->
  <rect width="100" height="100" rx="28" fill="url(#bg)"/>
  <!-- Speech bubble -->
  <g transform="translate(50,42)">
    <path d="M-28,-22 Q-28,-28 -22,-28 L22,-28 Q28,-28 28,-22 L28,8 Q28,14 22,14 L4,14 L-2,24 L-8,14 L-22,14 Q-28,14 -28,8 Z" fill="url(#bubble)" opacity="0.95"/>
    <!-- Letter A -->
    <text x="-12" y="2" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#0891b2">A</text>
    <!-- Checkmark -->
    <path d="M10,-6 L15,2 L24,-12" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Star sparkle top-right -->
  <g transform="translate(80,14)">
    <path d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8 Z" fill="#fbbf24"/>
  </g>
  <!-- Small sparkle top-left -->
  <g transform="translate(18,22)">
    <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#fbbf24" opacity="0.8"/>
  </g>
  <!-- Tiny sparkle bottom-right -->
  <g transform="translate(82,72)">
    <path d="M0,-3.5 L0.9,-0.9 L3.5,0 L0.9,0.9 L0,3.5 L-0.9,0.9 L-3.5,0 L-0.9,-0.9 Z" fill="white" opacity="0.5"/>
  </g>
</svg>
