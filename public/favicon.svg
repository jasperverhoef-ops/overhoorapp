<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Open book -->
  <g transform="translate(50,48)">
    <!-- Left page -->
    <path d="M-4,18 L-4,-14 Q-4,-20 -10,-20 L-30,-20 Q-34,-20 -34,-16 L-34,14 Q-34,18 -30,18 Z" fill="white" opacity="0.95"/>
    <!-- Right page -->
    <path d="M4,18 L4,-14 Q4,-20 10,-20 L30,-20 Q34,-20 34,-16 L34,14 Q34,18 30,18 Z" fill="white" opacity="0.85"/>
    <!-- Spine -->
    <path d="M-4,-20 Q0,-24 4,-20 L4,18 Q0,22 -4,18 Z" fill="white" opacity="0.7"/>
    <!-- Lines on left page -->
    <line x1="-28" y1="-10" x2="-10" y2="-10" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="-28" y1="-3" x2="-14" y2="-3" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="-28" y1="4" x2="-12" y2="4" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
    <!-- Checkmark on right page -->
    <path d="M12,-4 L18,4 L28,-10" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Star sparkle top-right -->
  <g transform="translate(76,16)">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#fbbf24"/>
  </g>
  <!-- Small sparkle -->
  <g transform="translate(22,20)">
    <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#fbbf24" opacity="0.7"/>
  </g>
</svg>
